# Nilai yang dibaca lewat Argo CD (k8s/gitops/application.yaml), dipakai
# bersama values.yaml. repository tetap (rilis yang di-sync Argo CD selalu
# datang dari GHCR, beda dari default values.yaml yang mengasumsikan image
# lokal hasil kind load). tag dan digest di-bump otomatis oleh job
# build-scan-push di ci.yml setiap push ke main yang lolos gate Trivy dan
# cosign sign, lewat commit langsung ke file ini (pesan commit memuat
# [skip ci]). Bukan dieksekusi tangan di luar CI setelah bootstrap ini.
# ghcr.io/qrizan/project-management privat, mengikuti visibilitas repo
# sumbernya. Node cluster butuh kredensial buat pull, dibuat 46-gitops.sh
# dari token yang dibuat manual (lihat CD.md).
imagePullSecrets:
  - ghcr-pull-secret

image:
  repository: ghcr.io/qrizan/project-management
  tag: 1643f0e057fd4320c538cc739e6610da316e661b
  digest: sha256:705d35e125699134d30893b5a7cf4fdb9b371dfcd88eae69b1d008bc581cff29

# Data contoh dimuat, sama seperti values-local.yaml, supaya rilis yang
# di-sync Argo CD punya data yang bisa dibandingkan dengan uji lain.
seed:
  enabled: true
