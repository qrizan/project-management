{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.seed.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Dijalankan setelah resource rilis diterapkan, karena mengisi data bukan
    # prasyarat aplikasi berjalan. Ikut jalan pada setiap pembaruan, bukan hanya
    # pemasangan pertama: Job ini idempoten, dan alat GitOps memperlakukan hook
    # pemasangan dan pembaruan sebagai hal yang sama sehingga membedakan keduanya
    # tidak bisa diandalkan.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "app.databaseClientLabel" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
      - name: seed
        image: "{{ .Values.seed.image.repository }}:{{ .Values.seed.image.tag }}"
        imagePullPolicy: {{ .Values.seed.image.pullPolicy }}
        command: ["/bin/bash", "-c"]
        # Tiap bagian diperiksa sendiri sebelum dimuat, sehingga Job aman
        # dijalankan ulang terhadap database yang sudah terisi sebagian.
        args:
        - |
          set -euo pipefail

          projects=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM "Project"')
          if [ "$projects" = "0" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /seed/SQL.txt
            echo "seed: data Category/Project dimuat"
          else
            echo "seed: Project sudah berisi $projects baris, dilewati"
          fi

          users=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM "User"')
          if [ "$users" = "0" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /seed/seed-user.sql
            echo "seed: user demo dimuat"
          else
            echo "seed: User sudah berisi $users baris, dilewati"
          fi
        env:
        {{- include "app.databaseUrlEnv" . | nindent 8 }}
        # psql menulis berkas riwayat ke direktori home; tanpa ini home menunjuk
        # ke lokasi yang tidak bisa ditulis pada root filesystem hanya-baca.
        - name: HOME
          value: /tmp
        securityContext:
          {{- include "app.containerSecurityContext" . | nindent 10 }}
        resources:
          {{- toYaml .Values.seed.resources | nindent 10 }}
        volumeMounts:
        - name: seed
          mountPath: /seed
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: seed
        configMap:
          name: {{ .Values.seed.configMapName }}
      - name: tmp
        emptyDir: {}
{{- end }}
