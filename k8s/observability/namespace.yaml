# node-exporter (bagian dari kube-prometheus-stack) butuh hostNetwork, hostPID,
# dan hostPath volume untuk membaca metrik node lewat /proc dan /sys.
# Ketiganya dilarang eksplisit bahkan oleh kebijakan baseline, bukan cuma
# restricted (Kubernetes Pod Security Standards).
# Namespace ini privileged, berbeda dari project-management dan garage yang
# tetap restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
