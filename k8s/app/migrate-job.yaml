apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: project-management
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        postgres-client: "true"
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # Image memakai `USER node` (nama, bukan angka). kubelet tidak bisa
        # memastikan itu bukan root tanpa menjalankan container, jadi UID-nya
        # harus disebut eksplisit; user `node` di image Node resmi ber-UID 1000.
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        # Stage `builder`, bukan `runner`: Prisma CLI sengaja tidak ikut ke image
        # produksi.
        image: project-management-app:builder
        imagePullPolicy: IfNotPresent
        command: ["bunx", "prisma", "migrate", "deploy"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: uri
        # Endpoint telemetri Prisma CLI tidak selalu bisa dijangkau dari
        # lingkungan ini dan pernah menggantung perintah sampai timeout.
        - name: CHECKPOINT_DISABLE
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
