apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: project-management
spec:
  # Satu instance: node kind cuma satu, sehingga tiga instance akan dijadwalkan
  # di node yang sama dan menambah beban tanpa redundansi nyata.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  bootstrap:
    initdb:
      database: mydb
      owner: johndoe
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: cnpg-backup-store
