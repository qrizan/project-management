# Tanpa policy default-deny, Pod yang tidak diseleksi policy mana pun menerima
# trafik dari seluruh cluster — termasuk Pod Job yang hidup sebentar. Namespace
# ditutup lebih dulu, lalu jalur yang memang dibutuhkan dibuka satu per satu.
#
# Egress sengaja belum dibatasi. Instance manager CNPG membuka koneksi ke API
# server Kubernetes, yang alamatnya berbeda tiap lingkungan dan tidak bisa
# dirujuk lewat selector — membatasi egress sekarang berarti menanam alamat
# spesifik lingkungan ini ke dalam manifest.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: project-management
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-gateway
  namespace: project-management
spec:
  podSelector:
    matchLabels:
      app: project-management
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    ports:
    - protocol: TCP
      port: 3000
---
# Diseleksi lewat label `postgres-client`, bukan lewat label aplikasi: Job
# migrate dan Job seed juga perlu menjangkau Postgres, sementara keduanya tidak
# boleh ikut terseleksi Service `app`. Menyamakan labelnya dengan Deployment
# akan membuat trafik Gateway sesekali mendarat di Pod Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-clients
  namespace: project-management
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          postgres-client: "true"
    ports:
    - protocol: TCP
      port: 5432
---
# Operator CNPG mem-polling status webserver instance manager di port 8000.
# Tanpa aturan ini `Cluster` berstatus error walau Postgres sendiri sehat, dan
# gejalanya tidak menyebut jaringan sama sekali. Dipisah dari aturan port 5432
# supaya jalur data aplikasi dan jalur kontrol operator tidak tercampur.
#
# Berlaku untuk seluruh Cluster CNPG di namespace ini, diseleksi lewat keberadaan
# kunci label — bukan satu nama cluster. Cluster yang dibuat untuk uji restore
# memakai nama berbeda, dan operator sama-sama perlu memantaunya.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-operator-status
  namespace: project-management
spec:
  podSelector:
    matchExpressions:
    - key: cnpg.io/cluster
      operator: Exists
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
