name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  build-scan-push:
    needs: lint-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Get image digest
        id: digest
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "ref=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.digest.outputs.ref }}"

      - name: Bump GitOps values
        env:
          DIGEST_REF: ${{ steps.digest.outputs.ref }}
        run: |
          digest="${DIGEST_REF#*@}"
          sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA}|" charts/app/values-deploy.yaml
          sed -i "s|^  digest: .*|  digest: ${digest}|" charts/app/values-deploy.yaml
          grep -q "  tag: ${GITHUB_SHA}" charts/app/values-deploy.yaml
          grep -q "  digest: ${digest}" charts/app/values-deploy.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/app/values-deploy.yaml

          if git diff --staged --quiet; then
            echo "values-deploy.yaml sudah mengarah ke tag/digest ini, tidak ada yang di-commit."
            exit 0
          fi

          # [skip ci] mencegah commit bump ini memicu run CI baru di repo yang
          # sama, sebab checkout di atas ada di project-management sendiri
          # (bukan repo terpisah seperti desain sebelumnya).
          git commit -m "Bump image to ${GITHUB_SHA} [skip ci]"

          success=0
          for i in 1 2 3 4 5; do
            if git push; then
              success=1
              break
            fi
            git pull --rebase
            sleep $((i * 3))
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::gagal push bump values-deploy.yaml ke main setelah 5 percobaan"
            exit 1
          fi
